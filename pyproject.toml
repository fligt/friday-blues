[project]
name = "friday-blues"
version = "0.1.0"
description = "This is a cool new python package."
readme = "README.md"
license = "MIT" 
license-files = ["LICENSE"]
authors = [
    { name = "Frank" }
]
requires-python = ">=3.14"
dependencies = []

#[project.scripts]
#fix-uv-jupytext = "fix_uv_jupytext:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.jupytext]
formats = "ipynb,qmd" 

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupyterlab-quarto>=0.3.5",
    "jupytext>=1.19.6",
    "nbclient>=0.11.0",
    "pip>=26.2.2",
]


